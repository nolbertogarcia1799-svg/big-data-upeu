name: Conservar estructura original taller S3S4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taller-s3s4-estructura.yml'
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtener exclusivamente los archivos originales del commit de referencia
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 "https://github.com/Linargote-laz/s3s4-laboratorio/archive/04b2a79dd03e5ee870ecb47d2bb9013f56c7e43a.tar.gz" -o "$RUNNER_TEMP/original.tar.gz"
          mkdir -p "$RUNNER_TEMP/laboratorio"
          tar -xzf "$RUNNER_TEMP/original.tar.gz" -C "$RUNNER_TEMP/laboratorio" --strip-components=1
          for item in R analisis data extras notebooks .gitattributes .gitignore S3S4_proyecto.Rproj; do
            cp -a "$RUNNER_TEMP/laboratorio/$item" "taller-s3s4/$item"
          done
          cp "$RUNNER_TEMP/laboratorio/README.md" taller-s3s4/README_LABORATORIO_ORIGINAL.md
          mkdir -p taller-s3s4/resultados taller-s3s4/entrega
          cp taller-s3s4/comparacion_caso_clase.csv taller-s3s4/resultados/
          cp taller-s3s4/comparacion_mi_dataset.csv taller-s3s4/resultados/
          cp taller-s3s4/TALLER_S3S4_RESUELTO.docx taller-s3s4/entrega/
          cp taller-s3s4/INFORME_TALLER_S3S4.html taller-s3s4/entrega/
          printf '# Procedencia del laboratorio\n\nEstructura y archivos obtenidos del commit [04b2a79](https://github.com/Linargote-laz/s3s4-laboratorio/commit/04b2a79dd03e5ee870ecb47d2bb9013f56c7e43a). Se conserva el material original; resultados y entregables van en carpetas separadas.\n\nEl ZIP original NO incorpora el notebook B6. Las comparaciones CSV son implementación alternativa documentada, no ejecución del B6 de clase.\n' > taller-s3s4/PROCEDENCIA.md
          test -s taller-s3s4/S3S4_proyecto.Rproj
          test -s taller-s3s4/analisis/eda_automatico.qmd
          test -s taller-s3s4/data/processed/wdbc_limpio.csv
          test -s taller-s3s4/entrega/TALLER_S3S4_RESUELTO.docx
      - name: Publicar y verificar estructura preservada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f taller-s3s4/R taller-s3s4/analisis taller-s3s4/data taller-s3s4/extras taller-s3s4/notebooks taller-s3s4/.gitattributes taller-s3s4/.gitignore taller-s3s4/S3S4_proyecto.Rproj taller-s3s4/README_LABORATORIO_ORIGINAL.md taller-s3s4/PROCEDENCIA.md taller-s3s4/resultados taller-s3s4/entrega
          git diff --cached --quiet || git commit -m "Taller S3S4: preservar estructura original y separar resultados individuales"
          git push
